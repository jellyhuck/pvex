name: lint

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          for f in ct/pvex.sh install/pvex-install.sh share/pvex-common.sh bin/pvex-run tests/*.sh; do
            bash -n "$f"
          done
      - name: shellcheck
        run: shellcheck -x -S warning ct/pvex.sh install/pvex-install.sh share/pvex-common.sh bin/pvex-run tests/*.sh
      - name: Tests
        run: |
          bash tests/test-pvex-run.sh
          bash tests/test-host-helpers.sh
